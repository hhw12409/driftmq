# ── 좌표 / 버전 ──────────────────────────────────────────────────────────────
GROUP=io.github.hhw12409
VERSION_NAME=0.1.0
POM_ARTIFACT_ID=driftmq

# ── Maven Central (Central Portal) 배포 설정 ────────────────────────────────
# 실제 인증값은 커밋하지 않는다. 릴리스 시 환경변수로 주입한다 (RELEASING.md 참조):
#   ORG_GRADLE_PROJECT_mavenCentralUsername / ...Password
#   ORG_GRADLE_PROJECT_signingInMemoryKey / ...KeyPassword
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true
RELEASE_SIGNING_ENABLED=true

# ── POM 메타데이터 ───────────────────────────────────────────────────────────
POM_NAME=DriftMQ
POM_DESCRIPTION=Lightweight single-node message broker for the JVM: durable append-only log, crash recovery, at-least-once delivery, zero runtime dependencies.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/hhw12409/driftmq

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/hhw12409/driftmq
POM_SCM_CONNECTION=scm:git:git://github.com/hhw12409/driftmq.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/hhw12409/driftmq.git

POM_DEVELOPER_ID=hhw12409
POM_DEVELOPER_NAME=hhw12409
POM_DEVELOPER_URL=https://github.com/hhw12409/

# ── Gradle ───────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
