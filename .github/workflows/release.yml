name: Release

# vX.Y.Z 태그를 push 하면: 테스트 → Maven Central 배포 → GitHub Release(+ fat JAR) 생성.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성용
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify tag matches VERSION_NAME
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROP=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "$TAG" = "$PROP" || { echo "tag $TAG != VERSION_NAME $PROP"; exit 1; }

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Stage runnable fat JAR for GitHub Release
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "build/libs/driftmq-${VER}.jar" "dist/driftmq-${VER}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/driftmq-*.jar
          generate_release_notes: true
